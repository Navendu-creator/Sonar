# Wazuh manager workers: receive and analyze agent events. Scale them with the
# number of agents; each new worker joins the master on its own.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-worker
  namespace: wazuh
spec:
  replicas: 2
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: worker
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: worker
    spec:
      # No workload talks to the Kubernetes API.
      automountServiceAccountToken: false
      # Spread the workers over nodes and AZs, without blocking scheduling
      # on a cluster that has fewer of either.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: wazuh-manager
                    node-type: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: wazuh-manager
              node-type: worker

      volumes:
        # A Secret volume holds symbolic links: an init container copies the
        # credentials to a regular file that only root can read.
        - name: wazuh-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: wazuh-credentials-secret
          secret:
            secretName: manager-credentials
            defaultMode: 0400
        - name: wazuh-manager-certs-raw
          secret:
            secretName: manager-certs
            defaultMode: 0400
        - name: wazuh-manager-certs
          emptyDir: {}

      # No fsGroup: kubelet would make the claim group-writable, and the manager
      # refuses a configuration directory that is.
      initContainers:
        - name: install-credentials
          image: wazuh/wazuh-manager # tag is set in kustomization.yaml
          command:
            - /bin/sh
            - -c
            - umask 077 && cp /credentials-secret/wazuh-credentials /run/secrets/wazuh-credentials && chmod 0400 /run/secrets/wazuh-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: wazuh-credentials-secret
              mountPath: /credentials-secret
              readOnly: true
            - name: wazuh-credentials
              mountPath: /run/secrets

        # Seeds etc/ and data/ on a fresh volume from the image, then installs
        # the certificates with the owners and modes the manager expects.
        - name: init-wazuh-etc
          image: wazuh/wazuh-manager # tag is set in kustomization.yaml
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # /. keeps the directory's own root:wazuh-manager 0770.
              if [ -z "$(ls -A /pvc-etc)" ]; then
                cp -a /etc/wazuh-manager/. /pvc-etc/
              fi
              # data/ is not in the image's permanent-data snapshot.
              if [ -z "$(ls -A /pvc-data)" ]; then
                cp -a /var/wazuh-manager/data/. /pvc-data/
              fi
              # Trust material as regular files, root:wazuh-manager 0640, as the
              # manager requires; never the Secret's symbolic links. One CA for
              # the deployment: the manager CA (without its key) and the indexer's.
              certs=/etc/wazuh-certs-final
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/ca-root-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/root-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/root-ca.pem "${certs}/indexer-ca.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager.pem "${certs}/indexer-connector.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-key.pem "${certs}/indexer-connector-key.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-remoted.pem "${certs}/remoted.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-remoted-key.pem "${certs}/remoted-key.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-apid.pem "${certs}/apid.pem"
              install -o 0 -g 101 -m 0640 /tmp/certs-raw/manager-apid-key.pem "${certs}/apid-key.pem"
          volumeMounts:
            - name: wazuh-manager-worker
              mountPath: /pvc-etc
              subPath: wazuh/etc/wazuh-manager
            - name: wazuh-manager-worker
              mountPath: /pvc-data
              subPath: wazuh/var/wazuh-manager/data
            - name: wazuh-manager-certs-raw
              mountPath: /tmp/certs-raw
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-certs-final

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager # tag is set in kustomization.yaml
          env:
            - name: WAZUH_INDEXER_HOSTS
              value: wazuh-indexer-0.wazuh-indexer:9200,wazuh-indexer-1.wazuh-indexer:9200,wazuh-indexer-2.wazuh-indexer:9200
            - name: WAZUH_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WAZUH_NODE_TYPE
              value: worker
            - name: WAZUH_REMOTE_BIND_ADDR
              value: "0.0.0.0"
            - name: WAZUH_CLUSTER_BIND_ADDR
              value: "0.0.0.0"
            - name: WAZUH_CLUSTER_NODES
              value: wazuh-manager-master-0.wazuh-cluster
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-cluster-key
                  key: key

          resources:
            # Sized to share a 2 vCPU / 8 GiB node with an indexer.
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 2Gi

          ports:
            - name: agents-https
              containerPort: 1517
            - name: agents-events
              containerPort: 1514
            - name: cluster
              containerPort: 1516

          # Workers do not run the API (apid), so it is left out of the check.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /var/wazuh-manager/bin/wazuh-manager-control status 2>/dev/null | grep -v apid | grep -qE 'not running|failed to start|refused its configuration' && exit 1 || exit 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          # One volume, split by subPath, so configuration, queues and logs
          # survive pod restarts.
          volumeMounts:
            - name: wazuh-credentials
              mountPath: /run/secrets
              readOnly: true
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/api/configuration
              subPath: wazuh/var/wazuh-manager/api/configuration
            - name: wazuh-manager-worker
              mountPath: /etc/wazuh-manager
              subPath: wazuh/etc/wazuh-manager
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/ca/root-ca.pem
              subPath: ca-root-ca.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/root-ca.pem
              subPath: root-ca.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/indexer-ca.pem
              subPath: indexer-ca.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/indexer-connector.pem
              subPath: indexer-connector.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/indexer-connector-key.pem
              subPath: indexer-connector-key.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/remoted.pem
              subPath: remoted.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/remoted-key.pem
              subPath: remoted-key.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/apid.pem
              subPath: apid.pem
            - name: wazuh-manager-certs
              mountPath: /etc/wazuh-manager/certs/apid-key.pem
              subPath: apid-key.pem
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/logs
              subPath: wazuh/var/wazuh-manager/logs
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/queue
              subPath: wazuh/var/wazuh-manager/queue
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/var/multigroups
              subPath: wazuh/var/wazuh-manager/var/multigroups
            - name: wazuh-manager-worker
              mountPath: /var/wazuh-manager/data
              subPath: wazuh/var/wazuh-manager/data

  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-worker
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: wazuh-storage
        resources:
          requests:
            storage: 10Gi
