# PipeCD ControlPlane configuration.
# Reference: https://pipecd.dev/docs-v0.58.x/user-guide/managing-controlplane/configuration-reference/
#
# __STATE_KEY__ is replaced by install.sh with a generated value, so the real
# key never lands in git. Every *File path points into the pipecd-secrets
# Secret, which the chart mounts at /etc/pipecd-secret.
apiVersion: "pipecd.dev/v1beta1"
kind: ControlPlane
spec:
  stateKey: __STATE_KEY__

  datastore:
    type: MYSQL
    config:
      url: pipecd-mysql:3306
      database: pipecd
      usernameFile: /etc/pipecd-secret/mysql-username
      passwordFile: /etc/pipecd-secret/mysql-password

  filestore:
    type: MINIO
    config:
      endpoint: http://pipecd-filestore:8333
      bucket: pipecd
      accessKeyFile: /etc/pipecd-secret/minio-access-key
      secretKeyFile: /etc/pipecd-secret/minio-secret-key
      autoCreateBucket: true

  # SSO: set the public URL, add a shared GitHub/OIDC config, and pick it when
  # creating the project on the ops page. Keep clientSecret out of git.
  # address: https://pipecd.example.com
  # sharedSSOConfigs:
  #   - name: github
  #     provider: GITHUB
  #     github:
  #       clientId: <client-id>
  #       clientSecret: <client-secret>
