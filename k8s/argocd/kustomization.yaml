apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD's CRDs are too large for client-side apply; install with:
#   kubectl apply --server-side --force-conflicts -k k8s/argocd
namespace: argocd

resources:
  - namespace.yaml
  # Pinned upstream release; bump the tag to upgrade.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
