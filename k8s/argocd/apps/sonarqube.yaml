# Deploys k8s/sonarqube from GitHub main and keeps the cluster in sync with it.
# Apply only after your local manifest changes are pushed, or Argo CD will
# roll the cluster back to whatever is on GitHub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Navendu-creator/Sonar.git
    targetRevision: main
    path: k8s/sonarqube

  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube

  syncPolicy:
    automated:
      prune: true     # delete resources removed from git
      selfHeal: true  # revert manual kubectl changes
